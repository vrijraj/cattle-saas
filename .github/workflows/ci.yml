name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Unit & DB migration integration tests
        run: pnpm test

      - name: ESLint
        run: pnpm lint

      - name: Production Next.js build
        env:
          DATABASE_URL: pglite:.data/pglite
          AUTH_SECRET: ci-build-placeholder-secret-32-chars-min
          AUTH_URL: http://localhost:3007
        run: pnpm build
